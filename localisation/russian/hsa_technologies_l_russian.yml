#industry
basics_of_metallurgy: "Основы метталургии"
basics_of_metallurgy_desc: "Небольшие сыродутые горны."
steel_plant_upgrade_0: "Штукофен"
steel_plant_upgrade_0_desc: "Более крупная печь, чем сыродутая. С 4х метровой трубой для усиления тяги."
steel_plant_upgrade_1: "Блауофен"
steel_plant_upgrade_1_desc: "Более крупня печь, чем штукофен. Подача нагретого воздуха и более крупная труба увеличивают температуру и обеспечивают больший выход стали."
steel_plant_upgrade_2: "Доменная печь"
steel_plant_upgrade_2_desc: "Более производительный аналог блауофена - шлаки отбивали от металла, а не металл от шлаков."
steel_plant_upgrade_3: "Передельный процесс"
steel_plant_upgrade_3_desc: "По мере повышения контроля над выплавкой процесс разделили на 2 части: сначала выплавка чугуна, затем стали."
steel_plant_upgrade_4: "Мартеновкие печи"
steel_plant_upgrade_4_desc: "Регенеративные пламенные печи, где нагретый газ и воздух подаваются в подину печи."
steel_plant_upgrade_5: "Электропечи"
steel_plant_upgrade_5_desc: "Крупные печи, что используют электрды и токи Фуко, чтобы вытопить металл из руды."