PRODUCTION_MATERIALS_FOOD: "Еда"
PRODUCTION_MATERIALS_BAUXITE: "Боксит"
PRODUCTION_MATERIALS_IRON: "Железо"
PRODUCTION_MATERIALS_SCHEELITIS: "Шеелит"
PRODUCTION_MATERIALS_CHROMITE: "Хромистый железняк"
PRODUCTION_MATERIALS_NUCLEAR_FUEL_PRIMARY: "Первичное ядерное топливо"
PRODUCTION_MATERIALS_NUCLEAR_FUEL_SECONDARY: "Вторичное ядерное топливо"
PRODUCTION_MATERIALS_THERMONUCLEAR_FUEL: "Термоядерное топливо"
PRODUCTION_MATERIALS_UNOBTANIUM: "Унобтаниум"
crystals_desc: "Кристаллы могут содержать в себе магию, которую можно использовать в различных магических изобретениях. Также они используются для создания ядерно-магических бомб."
food_desc: "Еда неотъемлемый ресурс страны. При его недостатке возникает голод и нормальное функционирование государства становится невозможным."
bauxite_desc: "Основной минерал для получения алюминия. Используется для создания жаропрочных и абразивных материлов."
iron_desc: "Дешевый материал, который можно использовать массово, однако получаемая из него сталь обладает более хорошими качествами."
scheelitis_desc: "Желтоватый минерал с очень высоким содержанием вольфрама. Также находит применение в ювелирном деле и оптике."
chromite_desc: "Используется для получения хрома. Является дешевым источником хроматов для химической промышлености."
nuclear_fuel_primary_desc: "Набор радиоактивных элементов, что встречается в природе. Используют как правило в производстве ядерного оружия и как мирный атом."
nuclear_fuel_secondary_desc: "Отработанное первичное топливо, что может быть обогащено на реакторах с быстрыми нейтронами."
thermonuclear_fuel_desc: "Термоядерное топливо, как правило это дейтерий, тритий и гелий-3."
unobtanium_desc: "Редкий и очень прочный материал. Обладает наивысочайшими показателями среди металов."
