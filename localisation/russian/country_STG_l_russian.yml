l_russian:
#national focuses
stg_focus_first_five_year_plan: "Первый пятилетний план"
stg_focus_first_five_year_plan_desc: "Наш политический курс напрямую затрагивает устройство экономики. Мы обязаны сменить курс на благо рабочего класса."
stg_focus_railroad_marks_staliongrad: "ЖД Маркс-Сталионград"
stg_focus_railroad_marks_staliongrad_desc: "Важная транспортная линия мужду столицей и вторым по численности городом."
stg_focus_railroad_hoovbeat_staliongrad: "ЖД Копытный-Сталионград"
stg_focus_railroad_hoovbeat_staliongrad_desc: "Виндиго расположились рядом с нашими границами! Наша армия должна быть готова немедленно выдвинуться туда!"
stg_focus_railroad_zlatocvet_staliongrad: "ЖД Златоцвет-Сталионград"
stg_focus_railroad_zlatocvet_staliongrad_desc: "Важная транспортная линия мужду столицей и третьим по численности городом."
stg_focus_railroad_zayatsk_staliongrad: "ЖД Заятск-Сталионград"
stg_focus_railroad_zayatsk_staliongrad_desc: "В городе Заятск находится крупный металлургический комбинат, выпускающий алюминий, мало кто его может позволить и нам надо пользоваться этим."
stg_focus_infrastructure_in_staliongrad: "Инфраструктура в Сталионграде"
stg_focus_infrastructure_in_staliongrad_desc: "Мы заложим транспортную сеть для гораздо более крупных проектов в нашей столице."
stg_focus_infrastructure_in_marks: "Инфраструктура в Марксе"
stg_focus_infrastructure_in_marks_desc: "Мы заложим транспортную сеть для гораздо более крупных проектов в Марксе"
stg_focus_infrastructure_in_zlatocvet: "Инфраструктура в Златоцвете"
stg_focus_infrastructure_in_zlatocvet_desc: "Мы заложим транспортную сеть для гораздо более крупных проектов в Златоцвете"
stg_focus_infrastructure_in_zayatsk: "Инфраструктура в Заятске"
stg_focus_infrastructure_in_zayatsk_desc: "Мы заложим транспортную сеть для гораздо более крупных проектов в Заятске"
stg_focus_civil_industry_effort: "Приоритет гражданской промышленности"
stg_focus_civil_industry_effort_desc: "Необходимо решить проблемы с товарами первого спроса!"
stg_focus_military_industry_effort: "Приоритет военной промышленности"
stg_focus_military_industry_effort_desc: "Враг не дремлет, обеспечим каждого оружием!"
stg_focus_defense_industry: "Оборонная промышленность"
stg_focus_defense_industry_desc: "Набор заовдов выпускающих оружие массово."
stg_focus_essential_goods_provision: "Гражданские предприятия"
stg_focus_essential_goods_provision_desc: "Набор фабрик производящих товары первой необходимости."
stg_focus_ilyich_factories: "Заводы имени Ильича"
stg_focus_ilyich_factories_desc: "Сталионград это крайне перспективный регион для индустриализации. Здесь мы и разместим заводы, которые покроют множество издержек."
stg_focus_zayatsk_aluminium_shafts: "Заятские алюминивые рудники"
stg_focus_zayatsk_aluminium_shafts_desc: "Для увеличения производства алюминия, мы разработаем новые рудники."
stg_focus_zayatsk_ore_preparations: "Заятский рудообогатительный комбинат"
stg_focus_zayatsk_ore_preparations_desc: "Алюминий довольно перспективный металл, мы можем нарастить произодство бокситов и простимулировать алюмолитейную промышленность. [aluminium_full_studied]"
stg_focus_zayatsk_aluminium_plants: "$aluminium_plant_plural$ в Заятске"
stg_focus_zayatsk_aluminium_plants_desc: "Реализация бокситных шахт в Заятске - это непосредственное его изготовление."
stg_focus_sovenok_iron_shafts: "Совенокские железные рудники"
stg_focus_sovenok_iron_shaftsv_desc: "В данном регионе огромные запасы легко добываемого магнетита, который является одним из основных источников железа."
stg_focus_sovenok_ore_preparations: "Совенокский рудообогатительный комбинат"
stg_focus_sovenok_ore_preparations_desc: "В наших планах снизить зависимость от поставок железной руды от §Y[MET.GetName]§!. Это позволит полность стабилизировать производство стали."
stg_focus_sovenok_steel_plants: "$steel_plant_plural$ в Совенке"
stg_focus_sovenok_steel_plants_desc: "Мы можем разместить производство стали буквально рядом с сырьевой базой, сократив издержки на транспортировку."
#ideas
STG_south_states_intergration: "Интеграция южных регионов"
STG_south_states_intergration_desc: "[PGT.GetName] передало земли взамен на эвакуацию их войск через нашу территорию. Несмотря на непосредственную близость к нам, наши идеологические взгляды и местного населения не совпадают полностью. Пока мы не заручимся поддержкой новых граждан - они будут стремиться к автономии и мешать нашим действиям на их землях.\n\n§YПо окончании интеграции регионы $STATE_160$, $STATE_162$, $STATE_164$, $STATE_326$ станут коренными.§!"
STG_eradicate_dissent_in_south_states: "Искоренение инакомыслия в юных регионах"
STG_eradicate_dissent_in_south_states_desc: "После идеологической обработки все еще остаются сторонние идеи, которые поддерживаются как и наша идеоллогия. Если мы потеряем контроль над этими регионами, они полностью подчиняться противнику. Нужно это исправить!\n\n§YПо окончании искоренения инакомыслия регионы $STATE_160$, $STATE_162$, $STATE_164$, $STATE_326$ перестанут считаться коренными для [PGT.GetName] и [EQS.GetName].§!\n\n§R[EQS.GetName] и [PGT.GetName] будут недовольны нашими действиями!§!"
STG_militarize_south_states: "Милитаризация южных регионов"
STG_militarize_south_states_desc: "Мы сделали южные регионы демиилтаризированными, чтобы не вызвать бурную реакцию населения. Кроме того демилитаризированная зона - одно из требований [PGT.GetName]. Но сейчас это наша земля и наш народ. Мы должны думать о защите наших границ.\n\n§YПо окончании милитаризации мы сможем размещать войска в регионах $STATE_160$, $STATE_162$, $STATE_164$, $STATE_326$.§!"
STG_WOP_frozen_civil_war: "Замороженнная гражданская война"
STG_WOP_frozen_civil_war_desc: "Север Эквестрии в 834 году получил особый экономический статус из-за массовой добычи металла. В результате чего в этом регионе скопилось большое количество чернорабочих. Для отстаивания норм работы трудяги объединялись и выдвигали минимальные требования. Дальнейшее развитие объединений переросло в профсоюзы и в развитие идей социализма, а затем и коммунизма на рудниках с сильной эксплуатацией.\nВидя надвигающиеся волнения, местные власти запросили в 959 году особую автономию, но это не решило проблему, а лишь замедлило подрыв пороховой бочки.\nВ 963 году местные олигархи, видя как фашизм начинает пускать корни, попытались объявить север Эквестрии независмым. Но их планам помешали военные и взяли все в свои копыта. Они предложили свои реформы, которые постепенно начали сбавлять напряжение в обществе.\nСпустя 4 года у рабочих появилась организованная политическая организация - коммунистическая партия. Она предлагала резко, дерзко и революционно решить все проблемы. Ее популярность росла быстрее, чем дествовали реформы военных. В итоге это привело к стачкам, а потом и к вооруженным конфликтам.\n25 октября 980 года страна поделилась на 2 лагеря - красных и белых. Бои продолжались до прихода виндиго.\n§YОбе стороны подписали перемирие на время, пока проблема с духами зимы не разрешится.§!"
STG_party_fragmentation: "Раскол в партии"
STG_party_fragmentation_desc: "В момент гражданской войны возникло 3 близких политических течения. В начале враг был главной проблемой, но сейчас внутрение дела показывают, что партия не так цела как тогда казалось...\n§RЭто отличный шанс для белого движения организованно дать отпор!§!"
