l_russian:
aluminium_full_studied_tt: "Алюминий - легкий и пластичный белый металл, матово-серебристый благодаря тонкой оксидной пленке, которая сразу же покрывает его на воздухе. Парамагнитен, хорошо проводит ток и тепло."
potassium_nitrate_full_studied_tt: "Нитрат калия (KNO₃) - белый гидроскопичный порошок или прозрачные кристаллы. Используется в производстве взрывчатки. Скорость детонации 1250м/с."
ammonium_nitrate_full_studied_tt: "Нитрат аммония (NH₄NO₃) - белое порошкообразное соединение, разлагается при нагреве. Скорость детонации 2570м/с."